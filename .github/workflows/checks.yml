name: YFG website checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: yfg-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: node .yarn/releases/yarn-3.3.0.cjs install --immutable
      - run: node .yarn/releases/yarn-3.3.0.cjs tsc --noEmit
      - run: node .yarn/releases/yarn-3.3.0.cjs build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
