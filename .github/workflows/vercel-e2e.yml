name: Vercel smoke checks

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deploymentUrl:
        description: YFG Vercel deployment URL
        required: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.target_url, 'yfgweb'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-deployment.mjs
        env:
          DEPLOYMENT_URL: ${{ inputs.deploymentUrl || github.event.deployment_status.target_url }}
